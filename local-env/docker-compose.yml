services:
  frontend:
    build: ../frontend
    container_name: predictorama-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: predictorama-backend
    command: ./mvnw spring-boot:run
    volumes:
      - ../backend:/app
      - ~/.m2:/root/.m2
    ports:
      - "8080:8080"
    environment:
      - ALLOWED_ORIGINS=http://localhost
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_LIQUIBASE_CONTEXTS=dev
      - DB_URL=jdbc:postgresql://db:5432/predictorama
      - DB_USERNAME=predictorama
      - DB_PASSWORD=predictorama
      - FOOTBALL_DATA_API_KEY=${FOOTBALL_DATA_API_KEY}
      - DEV_LEADERBOARD_BOOTSTRAP_ENABLED=true
      - DEV_LEADERBOARD_BOOTSTRAP_INITIAL_DELAY=5s
      - DEV_LEADERBOARD_BOOTSTRAP_COMPETITION=EC
      - DEV_LEADERBOARD_BOOTSTRAP_SEASON=2024
      - FIXTURE_SYNC_ENABLED=true
      - FIXTURE_SYNC_INITIAL_DELAY=15s
      - FIXTURE_SYNC_FIXED_DELAY=1m
      - FIXTURE_SYNC_LOOKBACK_DAYS=2
      - FIXTURE_SYNC_FUTURE_DAYS=28
      - FIXTURE_SYNC_COMPETITIONS=WC,EC,CL,PL,BL1,DED,BSA,PD,FL1,ELC,PPL,SA
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=QpqkhHrfekOKtB52hy1S/6iziGEPy23raL8M8V3b4XCSu9rMrXNJWPlRmvCI+R1DDfyRJML21aIR4k6DQy8e6Q==
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: predictorama-db
    environment:
      POSTGRES_DB: predictorama
      POSTGRES_USER: predictorama
      POSTGRES_PASSWORD: predictorama
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U predictorama -d predictorama" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
