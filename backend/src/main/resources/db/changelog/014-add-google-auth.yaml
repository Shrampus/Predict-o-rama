databaseChangeLog:
  - changeSet:
      id: 014-add-google-id-to-users
      author: hlp
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            - columnExists:
                tableName: users
                columnName: google_id
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: google_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
                    unique: true

  - changeSet:
      id: 014-drop-username-not-null
      author: hlp
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: |
              SELECT COUNT(*)
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'users'
                AND column_name = 'username'
                AND is_nullable = 'NO'
      changes:
        - dropNotNullConstraint:
            tableName: users
            columnName: username
            columnDataType: VARCHAR(50)
